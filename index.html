<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHƯƠNG THÙY AI VIDEO</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    color:#222;
}

.container{
    max-width:1100px;
    margin:0 auto;
    padding:30px 18px 60px;
}

.header{
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    color:white;
    padding:30px;
    border-radius:22px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.header h1{
    margin:0 0 8px;
    font-size:32px;
}

.header p{
    margin:0;
    opacity:.92;
}

.card{
    background:white;
    border-radius:18px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card h2{
    margin-top:0;
    font-size:21px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,.1);
}

.button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    color:white;
}

.button:hover{
    opacity:.93;
}

.button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#f3f4f6;
    display:none;
}

.script{
    display:none;
}

.script-title{
    font-size:25px;
    font-weight:800;
    margin-bottom:15px;
}

.hook{
    background:#fff7ed;
    border-left:5px solid #f97316;
    padding:15px;
    border-radius:10px;
    margin-bottom:18px;
}

.scene{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
    background:#fafafa;
}

.scene-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.scene-number{
    font-size:18px;
    font-weight:800;
}

.badge{
    background:#ede9fe;
    color:#6d28d9;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

.scene-row{
    margin-bottom:13px;
}

.scene-label{
    font-weight:700;
    margin-bottom:5px;
}

.scene-content{
    background:white;
    padding:12px;
    border-radius:9px;
    border:1px solid #eee;
    line-height:1.55;
}

.loading{
    text-align:center;
    padding:20px;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #ddd;
    border-top-color:#7c3aed;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>PHƯƠNG THÙY AI VIDEO</h1>
        <p>Từ một ý tưởng → AI tự viết kịch bản → chia cảnh → tạo prompt video chuyên nghiệp.</p>
    </div>

    <div class="card">

        <h2>✨ Tạo kịch bản tự động</h2>

        <div class="grid">

            <div class="field full">
                <label>Chủ đề / Sản phẩm</label>

                <input
                    id="topic"
                    placeholder="Ví dụ: Kem chống nắng ADA, món ăn dưỡng nhan, câu chuyện Spa..."
                >
            </div>

            <div class="field">
                <label>Thời lượng video</label>

                <select id="duration">
                    <option value="15 giây">15 giây</option>
                    <option value="30 giây" selected>30 giây</option>
                    <option value="45 giây">45 giây</option>
                    <option value="60 giây">60 giây</option>
                    <option value="90 giây">90 giây</option>
                </select>
            </div>

            <div class="field">
                <label>Phong cách video</label>

                <select id="style">
                    <option value="TikTok bán hàng">TikTok bán hàng</option>
                    <option value="Vlog đời thường">Vlog đời thường</option>
                    <option value="Review sản phẩm">Review sản phẩm</option>
                    <option value="Câu chuyện hài hước">Câu chuyện hài hước</option>
                    <option value="Luxury cinematic">Luxury cinematic</option>
                    <option value="Chuyên gia tư vấn">Chuyên gia tư vấn</option>
                </select>
            </div>

            <div class="field">
                <label>Đối tượng người xem</label>

                <input
                    id="audience"
                    value="Phụ nữ Việt Nam 25-50 tuổi"
                    placeholder="Ví dụ: phụ nữ 30-50 tuổi"
                >
            </div>

            <div class="field">
                <label>Giọng video</label>

                <select id="voice">
                    <option value="Nữ Việt Nam, nhẹ nhàng, tự nhiên, chuyên nghiệp">
                        Nữ Việt Nam - nhẹ nhàng
                    </option>

                    <option value="Nữ Việt Nam, trẻ trung, năng lượng">
                        Nữ Việt Nam - trẻ trung
                    </option>

                    <option value="Nữ Việt Nam, sang trọng, chậm rãi">
                        Nữ Việt Nam - sang trọng
                    </option>

                    <option value="Nữ Việt Nam, thân thiện, gần gũi">
                        Nữ Việt Nam - thân thiện
                    </option>
                </select>
            </div>

            <div class="field full">
                <label>Yêu cầu thêm</label>

                <textarea
                    id="extra"
                    placeholder="Ví dụ: Không nói quá lố, không phóng đại công dụng, có CTA cuối video..."
                ></textarea>
            </div>

        </div>

        <br>

        <button
            class="button"
            id="generateBtn"
            onclick="generateScript()"
        >
            ✨ AI TỰ VIẾT KỊCH BẢN
        </button>

        <div id="status" class="status"></div>

    </div>


    <div id="loading" class="card loading" style="display:none">

        <div class="spinner"></div>

        <strong>AI đang xây dựng kịch bản...</strong>

        <p>Đang phân tích chủ đề và chia thành các cảnh video.</p>

    </div>


    <div id="scriptBox" class="card script">

        <h2>🎬 Kịch bản hoàn chỉnh</h2>

        <div id="scriptContent"></div>

    </div>

</div>


<script>

const API_URL =
    "https://phuong-thuy-ai-video.phuongthuy-lotteria.workers.dev/";

async function generateScript(){

    const topic =
        document.getElementById("topic").value.trim();

    const duration =
        document.getElementById("duration").value;

    const style =
        document.getElementById("style").value;

    const audience =
        document.getElementById("audience").value.trim();

    const voice =
        document.getElementById("voice").value;

    const extra =
        document.getElementById("extra").value.trim();

    if(!topic){
        alert("Bạn hãy nhập chủ đề hoặc sản phẩm trước nhé.");
        return;
    }

    const button =
        document.getElementById("generateBtn");

    const loading =
        document.getElementById("loading");

    const scriptBox =
        document.getElementById("scriptBox");

    button.disabled = true;
    loading.style.display = "block";
    scriptBox.style.display = "none";

    try{

        const response = await fetch(API_URL,{
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                topic: topic,
                duration: duration,
                style: style,
                audience: audience,
                voice: voice,
                extra: extra
            })
        });

        const data = await response.json();

        if(!response.ok){

            let message = "Không thể tạo kịch bản.";

            if(data && data.error){

                if(typeof data.error === "string"){

                    message = data.error;

                }else if(data.error.message){

                    message = data.error.message;

                }else{

                    message =
                        JSON.stringify(data.error, null, 2);
                }
            }

            throw new Error(message);
        }

        /*
         * Worker hiện tại trả về:
         *
         * {
         *   success: true,
         *   script: "Nội dung kịch bản..."
         * }
         *
         * Vì vậy phải lấy data.script.
         */

        let scriptText = "";

        if(typeof data.script === "string"){

            scriptText = data.script;

        }else if(data.script){

            scriptText =
                JSON.stringify(
                    data.script,
                    null,
                    2
                );

        }else{

            scriptText =
                JSON.stringify(
                    data,
                    null,
                    2
                );
        }

        displayScript(scriptText);

        scriptBox.style.display = "block";

        scriptBox.scrollIntoView({
            behavior:"smooth"
        });

    }catch(error){

        alert(
            "Có lỗi khi tạo kịch bản:\n\n" +
            (error.message || String(error))
        );

    }finally{

        button.disabled = false;

        loading.style.display = "none";
    }
}


function displayScript(scriptText){

    const box = document.getElementById("scriptContent");

    if(!box){
        return;
    }

    let content = scriptText;

    if(typeof scriptText === "object"){
        try{
            content = JSON.stringify(scriptText, null, 2);
        }catch(error){
            content = String(scriptText);
        }
    }

    box.innerHTML = `
        <div
            class="scene-content"
            style="
                white-space:pre-wrap;
                line-height:1.7;
            "
        >
            ${escapeHtml(content)}
        </div>
    `;
}

function escapeHtml(text){

    if(
        text === undefined ||
        text === null
    ){

        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
