<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THÙY AI VIDEO — PixVerse Auto</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#111}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000010}.hero{color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;font-size:14px}textarea{min-height:90px}.btn{width:100%;border:0;border-radius:10px;padding:13px;color:#fff;font-weight:700;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,#7c3aed,#ec4899)}.btn:disabled{opacity:.5}.status{padding:12px;border-radius:9px;margin-top:12px;display:none}.ok{display:block;background:#ecfdf5;border:1px solid #bbf7d0}.err{display:block;background:#fef2f2;border:1px solid #fecaca}.info{display:block;background:#eff6ff;border:1px solid #bfdbfe}.scene{border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:12px}.scene h3{margin:0}.muted{color:#666;font-size:13px}.row{display:flex;gap:8px;align-items:center}.pill{font-size:12px;background:#ede9fe;color:#6d28d9;padding:4px 8px;border-radius:20px}.video{width:100%;max-height:560px;background:#000;border-radius:10px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="card hero"><h1>🎬 THÙY AI VIDEO — PIXVERSE AUTO</h1><p>Nhập ý tưởng → AI chia cảnh → dùng 1 ảnh nhân vật → PixVerse tự tạo từng cảnh → tự đồng bộ lời thoại.</p></div>
<div class="card"><div class="grid">
<div class="full"><label>Chủ đề / sản phẩm</label><input id="topic" value="Kem chống nắng ADA cho phụ nữ Việt Nam 30-50 tuổi"></div>
<div><label>Thời lượng</label><select id="duration"><option>30 giây</option><option selected>45 giây</option><option>60 giây</option></select></div>
<div><label>Phong cách</label><select id="style"><option selected>TikTok bán hàng</option><option>Vlog đời thường</option><option>Review sản phẩm</option><option>Luxury cinematic</option></select></div>
<div><label>Đối tượng</label><input id="audience" value="Phụ nữ Việt Nam 30-50 tuổi"></div>
<div><label>Chất lượng PixVerse</label><select id="quality"><option>540p</option><option selected>720p</option><option>1080p</option></select></div>
<div><label>Giọng PixVerse</label><select id="speaker"><option selected>auto</option><option>1</option><option>5</option><option>8</option><option>10</option></select></div>
<div class="full"><label>Ảnh nhân vật tham chiếu (bắt buộc)</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><div class="muted">Nên dùng ảnh dọc 9:16, rõ mặt, một người, dưới 20MB.</div></div>
<div class="full"><label>Yêu cầu thêm</label><textarea id="extra">Nhân vật nữ Việt Nam khoảng 30 tuổi, sang trọng, tự nhiên. Giữ khuôn mặt, tóc, trang phục và nhận diện nhất quán. Không phụ đề, không chữ trên màn hình, không watermark.</textarea></div>
</div><button class="btn" id="run">🚀 TẠO VIDEO TỰ ĐỘNG</button><div id="status" class="status"></div></div>
<div class="card"><h2>📋 Tiến trình</h2><div id="script"></div><div id="scenes"></div></div>
</div>
<script>
const SCRIPT_API_URL="https://script.google.com/macros/s/AKfycbzpIjAWninGb2hXQHezLSvRfd2G8TBFb8FRCjQkIjm-5Buyfbw6HjgTCl2sN9Stou2M/exec";
const PIXVERSE_WORKER_URL="https://thuy-ai-video-pixverse.phuongthuy-lotteria.workers.dev";
const $=id=>document.getElementById(id);
function status(msg,cls="info"){const e=$("status");e.className="status "+cls;e.style.display="block";e.innerHTML=msg}
function cleanJson(v){if(v&&typeof v==="object")return v;let t=String(v||"").trim().replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/\s*```$/i,"");try{return JSON.parse(t)}catch{}const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a)try{return JSON.parse(t.slice(a,b+1))}catch{}return null}
function callScript(){return new Promise((resolve,reject)=>{const cb="thuyPix_"+Date.now();const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("AI viết kịch bản phản hồi quá lâu"))},90000);function cleanup(){clearTimeout(timer);s.remove();try{delete window[cb]}catch{}}window[cb]=d=>{cleanup();resolve(d)};const prompt=["Bạn là đạo diễn video AI TikTok.","Chủ đề: "+$("topic").value,"Thời lượng: "+$("duration").value,"Phong cách: "+$("style").value,"Đối tượng: "+$("audience").value,"Yêu cầu: "+$("extra").value,"Tạo 4-6 cảnh, tổng thời lượng đúng gần yêu cầu. Mỗi cảnh có duration_seconds là NUMBER từ 1 đến 15, visual_description, dialogue, video_prompt bằng tiếng Anh. Nhân vật nhất quán. Video dọc 9:16. Không chữ, không phụ đề, không watermark. Chỉ trả JSON, không markdown.",'{"title":"...","total_duration_seconds":45,"summary":"...","scenes":[{"scene":1,"duration_seconds":8,"visual_description":"...","dialogue":"...","video_prompt":"..."}]}'].join("\n");const q=new URLSearchParams({callback:cb,prompt,topic:$("topic").value,duration:$("duration").value,style:$("style").value,audience:$("audience").value,extra:$("extra").value});s.src=SCRIPT_API_URL+"?"+q.toString();s.onerror=()=>{cleanup();reject(new Error("Không kết nối được AI viết kịch bản"))};document.body.appendChild(s)})}
async function api(path,opts={}){const r=await fetch(PIXVERSE_WORKER_URL+path,opts);const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d?.pixverse?.ErrMsg||d.message||d.error||("HTTP "+r.status));return d}
async function upload(file){const f=new FormData();f.append("image",file,file.name);const d=await api("/upload-image",{method:"POST",body:f});return d.pixverse.Resp.img_id}
async function generate(imgId,scene){let seconds=Math.max(1,Math.min(15,Number(scene.duration_seconds)||6));const p="@main_character "+(scene.video_prompt||scene.visual_description||"")+". Maintain the exact same person identity, face, hair and outfit from the reference image. Vertical 9:16, realistic cinematic motion, natural human movement, no subtitles, no text, no watermark.";const d=await api("/generate-fusion",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({img_id:imgId,prompt:p,duration:seconds,quality:$("quality").value,aspect_ratio:"9:16",model:"v6"})});return d.pixverse.Resp.video_id}
async function waitVideo(id){for(let i=0;i<90;i++){const d=await api("/status?video_id="+encodeURIComponent(id));const x=d.pixverse?.Resp;if(x?.status===1)return x.url;if(x?.status===7)throw new Error("PixVerse kiểm duyệt không cho cảnh này");if(x?.status===8)throw new Error("PixVerse tạo cảnh thất bại");await new Promise(r=>setTimeout(r,4000))}throw new Error("Cảnh xử lý quá lâu")}
async function lipsync(id,text){if(!text||!text.trim())return id;const t=[...text.trim()].slice(0,200).join("");const d=await api("/lipsync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_video_id:id,lip_sync_tts_speaker_id:$("speaker").value,lip_sync_tts_content:t})});return d.pixverse.Resp.video_id}
async function run(){const file=$("image").files[0];if(!file){status("❌ Hãy chọn ảnh nhân vật trước.","err");return}$("run").disabled=true;$("scenes").innerHTML="";try{status("⏳ 1/4 AI đang viết và chia cảnh...","info");const raw=await callScript();const script=cleanJson(raw.result||raw.text||raw);if(!script||!Array.isArray(script.scenes))throw new Error("Kịch bản AI không có scenes hợp lệ");$("script").innerHTML='<b>✅ '+(script.title||"Kịch bản")+'</b><div class="muted">'+script.scenes.length+' cảnh</div>';status("⏳ 2/4 Đang tải ảnh tham chiếu lên PixVerse...","info");const imgId=await upload(file);status("⏳ 3/4 Đã nhận ảnh. Đang gửi tất cả cảnh sang PixVerse...","info");const jobs=await Promise.all(script.scenes.map(async(s,i)=>{const e=document.createElement("div");e.className="scene";e.id="scene"+i;e.innerHTML='<div class="row"><h3>🎬 Cảnh '+(i+1)+'</h3><span class="pill">'+(Number(s.duration_seconds)||6)+' giây</span></div><div class="muted">'+(s.dialogue||"")+'</div><div id="st'+i+'" class="status info">Đang gửi yêu cầu...</div>';$("scenes").appendChild(e);try{const id=await generate(imgId,s);$("st"+i).innerHTML="⏳ PixVerse đang tạo cảnh...";return {i,s,id}}catch(err){$("st"+i).className="status err";$("st"+i).innerHTML="❌ "+err.message;return null}}));status("⏳ 4/4 Đang chờ PixVerse hoàn tất và tự đồng bộ lời thoại...","info");await Promise.all(jobs.filter(Boolean).map(async job=>{try{const url=await waitVideo(job.id);let finalUrl=url;if(job.s.dialogue&&job.s.dialogue.trim()){const lipId=await lipsync(job.id,job.s.dialogue);finalUrl=await waitVideo(lipId)}$("st"+job.i).className="status ok";$("st"+job.i).innerHTML='✅ Hoàn tất<br><video class="video" controls playsinline src="'+finalUrl+'"></video><p><a href="'+finalUrl+'" target="_blank" rel="noopener">Mở / lưu video cảnh '+(job.i+1)+'</a></p>'}catch(err){$("st"+job.i).className="status err";$("st"+job.i).innerHTML="❌ "+err.message}}));status("✅ Đã hoàn tất các cảnh. Mỗi cảnh đã được tạo và đồng bộ lời thoại tự động.","ok")}catch(err){status("❌ "+err.message,"err")}finally{$("run").disabled=false}}
$("run").onclick=run;
</script></body></html>
